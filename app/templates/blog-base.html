{% extends "base.html" %}

{% block body %}
<div class="max-w-4xl mx-auto px-6 py-12">
  
  <header class="mb-12">
    <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Articles</h1>
    <p class="mt-3 text-lg text-slate-500 italic">Thoughts on code, design, and everything in between.</p>
  </header>

  <section hx-boost="false" class="space-y-4">
    {% for post in posts %}
      <a href="{{ url_for('home.blog', post=post) }}" 
         class="group block p-6 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md hover:border-blue-300 transition-all duration-200">
        
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-semibold text-slate-800 group-hover:text-blue-600 capitalize transition-colors">
            {{ post | replace("_", " ") }}
          </h2>
          
          <svg xmlns="http://www.w3.org/2000/svg" 
               class="h-5 w-5 text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all" 
               fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>
        
        <p class="mt-2 text-sm text-slate-400">Read article &rarr;</p>
      </a>
    {% else %}
      <div class="text-center py-20 bg-slate-100 rounded-2xl border-2 border-dashed border-slate-200">
        <p class="text-slate-500">No articles found yet. Check back soon!</p>
      </div>
    {% endfor %}
  </section>

</div>
{% endblock %}
