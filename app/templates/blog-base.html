{% extends "base.html" %}

{% block body %}

  <section hx-boost="false" class="blog-list">
    <h2>Articles</h2>
  
    <div class="blog-list">

      {% for post in posts %}

        <a  class="blog-list-item" href="{{ url_for('home.blog', post=post) }}">{{ post | replace("_", " ") }}</a>

      {% endfor %} 

    </div>

  </section>

{% endblock %}
